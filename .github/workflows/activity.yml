To fix your GitHub Actions workflow, please follow these steps:

1.  **Navigate to the file** on GitHub: [https://github.com/Ahmad-Akram7/Ahmad-Akram7/blob/main/.github/workflows/activity.yml](https://github.com/Ahmad-Akram7/Ahmad-Akram7/blob/main/.github/workflows/activity.yml)
2.  **Click the "Edit this file"** (pencil) icon in the top right.
3.  **Replace the existing content** with the code below.
4.  **Click "Commit changes"** at the bottom of the page.

Here is the corrected code to paste:
name: Update README Activity

on:
  schedule:
    - cron: '*/30 * * * *' # run every 30 minutes
  workflow_dispatch:

jobs:
  update-readme:
    name: Update Profile README with Recent Activity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          COMMIT_MSG: "Update README Activity"
          MAX_LINES: 10
